<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="0" y1="64" x2="0" y2="960">
      <stop offset="0" stop-color="#F0263A"/>
      <stop offset="1" stop-color="#8E0614"/>
    </linearGradient>
    <linearGradient id="fg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFD9DC"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4A0008" flood-opacity="0.4"/>
    </filter>
  </defs>

  <rect x="64" y="64" width="896" height="896" rx="208" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <path d="M332 280 V540 a180 180 0 0 0 360 0 V280"
          fill="none" stroke="url(#fg)" stroke-width="168" stroke-linecap="round"/>
  </g>

  <!-- Vertical slits in the background colour split the solid "u" into
       three equalizer bars (two tall arms, a short centre) without losing the letter. -->
  <g fill="url(#bg)">
    <rect x="404" y="180" width="28" height="720"/>
    <rect x="592" y="180" width="28" height="720"/>
  </g>
</svg>
